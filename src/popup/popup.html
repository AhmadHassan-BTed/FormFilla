<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FormFilla</title>
  <link rel="stylesheet" href="popup.css">
  <style id="fouc-preventer">
    body {
      visibility: hidden !important;
    }
  </style>
  <script src="theme-loader.js"></script>
</head>

<body>
  <div class="card">
    <!-- ===== STANDARD HEADER ===== -->
    <div class="header">
      <div class="logo">
        <img class="logo-svg" src="../assets/logo.svg" alt="FormFilla logo" width="20" height="20">
        <span class="logo-text">FormFilla</span>
      </div>
      <button id="options-btn" class="icon-btn" type="button" aria-label="Open settings" title="Open settings">
        <svg class="options-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M19.14,12.94a7.43,7.43,0,0,0,.05-.94,7.43,7.43,0,0,0-.05-.94l2.11-1.65a.5.5,0,0,0,.12-.64l-2-3.46a.5.5,0,0,0-.6-.22l-2.49,1a7.28,7.28,0,0,0-1.63-.94l-.38-2.65a.5.5,0,0,0-.5-.42H10.22a.5.5,0,0,0-.5.42L9.34,4.11a7.28,7.28,0,0,0-1.63.94l-2.49-1a.5.5,0,0,0-.6.22l-2,3.46a.5.5,0,0,0,.12.64L4.85,10.6a7.43,7.43,0,0,0-.05.94,7.43,7.43,0,0,0,.05.94L2.74,14.13a.5.5,0,0,0-.12.64l2,3.46a.5.5,0,0,0,.6.22l2.49-1a7.28,7.28,0,0,0,1.63.94l.38,2.65a.5.5,0,0,0,.5.42h4.56a.5.5,0,0,0,.5-.42l.38-2.65a7.28,7.28,0,0,0,1.63-.94l2.49,1a.5.5,0,0,0,.6-.22l2-3.46a.5.5,0,0,0-.12-.64ZM12,15.5A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z" />
        </svg>
      </button>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <div id="main-content" class="content">
      <p class="description">
        Local-first, deterministic form autofiller. No AI models or network requests.
      </p>

      <button id="fill-btn" class="primary-btn">
        <span class="btn-text">Fill this page</span>
        <span class="btn-shine"></span>
      </button>

      <button id="target-map-btn" class="secondary-btn text-btn" type="button" style="margin-top: 8px; width: 100%; border: 1px dashed var(--accent-indigo); background: rgba(99, 102, 241, 0.05); padding: 8px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--accent-indigo); font-weight: 500;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 6px; vertical-align: middle;">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
        <span style="vertical-align: middle; font-size: 12px;">Learn new fields interactively</span>
      </button>
 
      <div id="results-panel" class="results-panel hidden">
        <h3 class="results-title">Analysis & Fill Summary (<span id="count-total">0</span> Fields)</h3>
        <div class="results-grid">
          <div class="result-item confident">
            <span class="result-val" id="count-confident">0</span>
            <span class="result-lbl">Confident</span>
          </div>
          <div class="result-item review">
            <span class="result-val" id="count-review">0</span>
            <span class="result-lbl">Review</span>
          </div>
          <div class="result-item confirm">
            <span class="result-val" id="count-confirm">0</span>
            <span class="result-lbl">Needs Action</span>
          </div>
          <div class="result-item unmapped">
            <span class="result-val" id="count-unmapped">0</span>
            <span class="result-lbl">Unmapped</span>
          </div>
        </div>

        <!-- Scanned Fields List -->
        <div class="scanned-fields-section" style="margin-top: 14px; border-top: 1px solid var(--border-color); padding-top: 12px;">
          <button id="toggle-fields-btn" class="secondary-btn text-btn" type="button" style="width: 100%; justify-content: space-between; display: flex; align-items: center; padding: 6px 10px; background: transparent; border: none; cursor: pointer; color: var(--text-secondary); font-size: 12px; font-weight: 500;">
            <span>Show Page Fields</span>
            <svg id="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="transition: transform 0.2s ease;">
              <path d="M7 10l5 5 5-5H7z"/>
            </svg>
          </button>
          <div id="scanned-fields-list" class="scanned-fields-list hidden" style="margin-top: 8px; max-height: 150px; overflow-y: auto; background: rgba(0, 0, 0, 0.15); padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); font-size: 11px; text-align: left; display: flex; flex-direction: column; gap: 6px;">
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
      <div class="footer-status">
        <span class="status-dot"></span>
        <span id="status-text">Ready to fill</span>
      </div>
      <a href="https://github.com/AhmadHassan-BTed" target="_blank" class="credit-link"
        title="Created by AhmadHassan-BTed">by <strong>@AhmadHassan-BTed</strong></a>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
