<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hired</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <svg class="logo-svg" viewBox="0 0 24 24">
          <defs>
            <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1" />
              <stop offset="100%" stop-color="#a855f7" />
            </linearGradient>
          </defs>
          <path d="M12 2s-4 4.5-4 9.5c0 1 .5 2.5 1.5 3.5l1.5-1.5v-7l1 1 1-1v7l1.5 1.5c1-1 1.5-2.5 1.5-3.5C16 6.5 12 2 12 2zm-1.5 17c-.83 0-1.5.67-1.5 1.5v1.5h6v-1.5c0-.83-.67-1.5-1.5-1.5h-3z" fill="url(#brand-grad)" />
        </svg>
        <span class="logo-text">Hired</span>
      </div>
      <button id="options-btn" class="icon-btn" title="Open Settings">
        <svg class="options-svg" viewBox="0 0 24 24">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </div>

    <div class="content">
      <p class="description">
        Local-first, deterministic form autofiller. No AI models or network requests.
      </p>

      <button id="fill-btn" class="primary-btn">
        <span class="btn-text">Fill this page</span>
        <span class="btn-shine"></span>
      </button>

      <div id="results-panel" class="results-panel hidden">
        <h3 class="results-title">Analysis & Fill Summary</h3>
        <div class="results-grid">
          <div class="result-item confident">
            <span class="result-val" id="count-confident">0</span>
            <span class="result-lbl">Confident</span>
          </div>
          <div class="result-item review">
            <span class="result-val" id="count-review">0</span>
            <span class="result-lbl">Review</span>
          </div>
          <div class="result-item confirm">
            <span class="result-val" id="count-confirm">0</span>
            <span class="result-lbl">Needs Action</span>
          </div>
          <div class="result-item unmapped">
            <span class="result-val" id="count-unmapped">0</span>
            <span class="result-lbl">Unmapped</span>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="status-dot"></span>
      <span id="status-text">Ready to fill</span>
      <span class="footer-spacer"></span>
      <a href="https://github.com/AhmadHassan-BTed" target="_blank" class="credit-link" title="Created by AhmadHassan-BTed">by <strong>@AhmadHassan-BTed</strong></a>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
