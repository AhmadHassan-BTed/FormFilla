<h2 class="section-title">Academics & Scholarships</h2>

<h3 class="subsection-title">Application Track & Citizenship</h3>
<div class="card grid-3">
  <div class="form-group">
    <label for="academics-applicationTrack">Application Track</label>
    <input type="text" id="academics-applicationTrack" placeholder="e.g. Embassy Track">
  </div>
  <div class="form-group span-2">
    <label for="academics-recommendedEmbassy">Recommended Embassy</label>
    <input type="text" id="academics-recommendedEmbassy" placeholder="e.g. Embassy of the Republic of Korea to Pakistan">
  </div>
  <div class="form-group">
    <label for="academics-applicationProgram">Application Program</label>
    <input type="text" id="academics-applicationProgram" placeholder="e.g. General">
  </div>
  <div class="form-group">
    <label for="academics-degreeProgram">Degree Program to Apply</label>
    <input type="text" id="academics-degreeProgram" placeholder="e.g. Master's Degree">
  </div>
  <div class="form-group">
    <label for="academics-desiredFieldOfStudy">Desired Field of Study (Division)</label>
    <input type="text" id="academics-desiredFieldOfStudy" placeholder="e.g. Engineering (Artificial Intelligence)">
  </div>
  <div class="form-group">
    <label for="academics-koreanCitizenshipApplicant">Korean Citizenship (Applicant)</label>
    <select id="academics-koreanCitizenshipApplicant">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>
  </div>
  <div class="form-group">
    <label for="academics-koreanCitizenshipParent">Korean Citizenship (Parent/s)</label>
    <select id="academics-koreanCitizenshipParent">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>
  </div>
</div>

<h3 class="subsection-title">Standardized Test Scores & TOPIK</h3>
<div class="card grid-3">
  <div class="form-group">
    <label for="academics-greVerbal">GRE Verbal Score</label>
    <input type="text" id="academics-greVerbal" placeholder="e.g. 160">
  </div>
  <div class="form-group">
    <label for="academics-greQuant">GRE Quantitative Score</label>
    <input type="text" id="academics-greQuant" placeholder="e.g. 165">
  </div>
  <div class="form-group">
    <label for="academics-greWriting">GRE Analytical Writing</label>
    <input type="text" id="academics-greWriting" placeholder="e.g. 4.5">
  </div>
  <div class="form-group">
    <label for="academics-greTotal">GRE Total Score</label>
    <input type="text" id="academics-greTotal" placeholder="e.g. 325">
  </div>
  <div class="form-group">
    <label for="academics-toeflTotal">TOEFL Total Score</label>
    <input type="text" id="academics-toeflTotal" placeholder="e.g. 110">
  </div>
  <div class="form-group">
    <label for="academics-ieltsBand">IELTS Band Score</label>
    <input type="text" id="academics-ieltsBand" placeholder="e.g. 8.0">
  </div>
  <div class="form-group">
    <label for="academics-satTotal">SAT Total Score</label>
    <input type="text" id="academics-satTotal" placeholder="e.g. 1520">
  </div>
  <div class="form-group">
    <label for="academics-actTotal">ACT Total Score</label>
    <input type="text" id="academics-actTotal" placeholder="e.g. 34">
  </div>
  <div class="form-group">
    <label for="academics-topikLevel">TOPIK Level</label>
    <input type="text" id="academics-topikLevel" placeholder="e.g. Level 5">
  </div>
  <div class="form-group">
    <label for="academics-topikTestHeld">TOPIK Test Round</label>
    <input type="text" id="academics-topikTestHeld" placeholder="e.g. 81st">
  </div>
  <div class="form-group">
    <label for="academics-topikTestDate">TOPIK Test Date</label>
    <input type="text" id="academics-topikTestDate" placeholder="e.g. 2026-07-06">
  </div>
</div>

<h3 class="subsection-title">High School & Degree History</h3>
<div class="card grid-3">
  <!-- High School -->
  <div class="form-group">
    <label for="academics-highSchoolName">High School Name</label>
    <input type="text" id="academics-highSchoolName" placeholder="Punjab Group of Colleges">
  </div>
  <div class="form-group">
    <label for="academics-highSchoolLocation">Location (Country)</label>
    <input type="text" id="academics-highSchoolLocation" placeholder="Pakistan">
  </div>
  <div class="form-group">
    <label for="academics-highSchoolGraduationYear">Year of Graduation</label>
    <input type="text" id="academics-highSchoolGraduationYear" placeholder="2022">
  </div>

  <!-- Bachelors Thesis & Pubs -->
  <div class="form-group span-2">
    <label for="academics-bachelorsThesisTitle">Bachelor's Degree Thesis Title</label>
    <input type="text" id="academics-bachelorsThesisTitle" placeholder="e.g. Fractal Framework">
  </div>
  <div class="form-group span-3">
    <label for="academics-bachelorsPublications">Bachelor's Published Books & Research Papers</label>
    <textarea id="academics-bachelorsPublications" rows="3" placeholder="List any publications during bachelor's degree..."></textarea>
  </div>

  <!-- Masters Degree -->
  <div class="form-group">
    <label for="academics-mastersUniversityName">Master's University Name</label>
    <input type="text" id="academics-mastersUniversityName" placeholder="e.g. Air University">
  </div>
  <div class="form-group">
    <label for="academics-mastersLocation">Location (Country)</label>
    <input type="text" id="academics-mastersLocation" placeholder="e.g. Pakistan">
  </div>
  <div class="form-group">
    <label for="academics-mastersMajor">Major</label>
    <input type="text" id="academics-mastersMajor" placeholder="e.g. Software Engineering">
  </div>
  <div class="form-group">
    <label for="academics-mastersGraduationDate">Graduation/Award Date</label>
    <input type="text" id="academics-mastersGraduationDate" placeholder="e.g. 2026-07">
  </div>
  <div class="form-group span-2">
    <label for="academics-mastersThesisTitle">Master's Degree Thesis Title</label>
    <input type="text" id="academics-mastersThesisTitle" placeholder="e.g. Advanced Federated Architectures">
  </div>
  <div class="form-group span-3">
    <label for="academics-mastersPublications">Master's Published Books & Research Papers</label>
    <textarea id="academics-mastersPublications" rows="3" placeholder="List any publications during master's degree..."></textarea>
  </div>

  <!-- Doctoral Degree -->
  <div class="form-group">
    <label for="academics-doctoralUniversityName">Doctoral University Name</label>
    <input type="text" id="academics-doctoralUniversityName" placeholder="e.g. KAIST">
  </div>
  <div class="form-group">
    <label for="academics-doctoralLocation">Location (Country)</label>
    <input type="text" id="academics-doctoralLocation" placeholder="e.g. South Korea">
  </div>
  <div class="form-group">
    <label for="academics-doctoralMajor">Major</label>
    <input type="text" id="academics-doctoralMajor" placeholder="e.g. Computing">
  </div>
  <div class="form-group">
    <label for="academics-doctoralGraduationDate">Graduation/Award Date</label>
    <input type="text" id="academics-doctoralGraduationDate" placeholder="e.g. 2030-07">
  </div>
  <div class="form-group span-2">
    <label for="academics-doctoralDissertationTitle">Doctoral Dissertation Title</label>
    <input type="text" id="academics-doctoralDissertationTitle" placeholder="e.g. Decentralized Edge Frameworks">
  </div>
  <div class="form-group span-3">
    <label for="academics-doctoralPublications">Doctoral Published Books & Research Papers</label>
    <textarea id="academics-doctoralPublications" rows="3" placeholder="List any publications during doctoral degree..."></textarea>
  </div>
</div>

<h3 class="subsection-title">Academic Transcript & Grades</h3>
<div class="card grid-2">
  <div class="form-group">
    <label for="academics-cgpaScale">CGPA indicated on Transcript / scale</label>
    <input type="text" id="academics-cgpaScale" placeholder="e.g. 3.67 / 4.00">
  </div>
  <div class="form-group">
    <label for="academics-scorePercentile">Score Percentile</label>
    <input type="text" id="academics-scorePercentile" placeholder="e.g. 92.00 / 100">
  </div>
</div>

<h3 class="subsection-title">Personal Statement & Study Plans</h3>
<div class="card">
  <div class="form-group">
    <label for="academics-personalStatement">Personal Statement</label>
    <textarea id="academics-personalStatement" rows="8" placeholder="Introduce yourself, your motivation, academic backgrounds, hobbies..."></textarea>
  </div>
  <div class="form-group" style="margin-top: 15px;">
    <label for="academics-studyPlan">Study Plan (Language Study & Research Goals)</label>
    <textarea id="academics-studyPlan" rows="8" placeholder="Describe your language learning plan and master's/doctoral research objectives..."></textarea>
  </div>
  <div class="form-group" style="margin-top: 15px;">
    <label for="academics-futurePlanAfterStudy">Future Plan after Study</label>
    <textarea id="academics-futurePlanAfterStudy" rows="6" placeholder="Detail your plans after graduation (job search, research, PhD)..."></textarea>
  </div>
</div>

<h3 class="subsection-title">Research & Advising</h3>
<div class="card grid-2">
  <div class="form-group">
    <label for="academics-proposedAdvisor">Proposed Advisor / Supervisor</label>
    <input type="text" id="academics-proposedAdvisor" placeholder="e.g. Dr. Sarah Jenkins">
  </div>
  <div class="form-group span-2">
    <label for="academics-researchInterests">Research Interests Topic</label>
    <textarea id="academics-researchInterests" rows="3" placeholder="Describe your areas of interest, research goals, or publication summaries..."></textarea>
  </div>
</div>

<h3 class="subsection-title">Financial & Funding Details</h3>
<div class="card grid-2">
  <div class="form-group">
    <label for="academics-annualHouseholdIncome">Annual Household Income (USD/Equivalent)</label>
    <input type="text" id="academics-annualHouseholdIncome" placeholder="e.g. 25000">
  </div>
  <div class="form-group checkbox-group" style="margin-top: 30px;">
    <input type="checkbox" id="academics-fundingRequired">
    <label for="academics-fundingRequired">Funding / Scholarship Support Required</label>
  </div>
</div>
