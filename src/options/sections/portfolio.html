<div class="section-header">
  <h2 class="section-title">Portfolio, Skills & Achievements</h2>
</div>

<!-- Skills Section -->
<h3 class="subsection-title">Technical Skills</h3>
<div class="card">
  <div class="form-group">
    <label for="portfolio-skills">Skills (comma-separated list of programming languages, tools, etc.)</label>
    <textarea id="portfolio-skills" rows="3" placeholder="e.g. JavaScript, Python, TensorFlow, Git, Docker, System Architecture"></textarea>
  </div>
</div>

<!-- Coursework Section -->
<h3 class="subsection-title" style="margin-top: 24px;">Relevant Coursework</h3>
<div class="card">
  <div class="form-group">
    <label for="portfolio-coursework">Coursework (comma-separated list of key courses)</label>
    <textarea id="portfolio-coursework" rows="3" placeholder="e.g. Software Design & Architecture, Data Structures & Algorithms, NLP"></textarea>
  </div>
</div>

<!-- Languages Section -->
<div class="section-header" style="margin-top: 24px;">
  <h3 class="subsection-title">Languages</h3>
  <button type="button" id="add-language-btn" class="secondary-btn">+ Add Language</button>
</div>
<div id="languages-list" class="list-container">
  <!-- Dynamic items loaded by JS -->
</div>

<!-- Certifications Section -->
<div class="section-header" style="margin-top: 24px;">
  <h3 class="subsection-title">Certifications</h3>
  <button type="button" id="add-certification-btn" class="secondary-btn">+ Add Certification</button>
</div>
<div id="certifications-list" class="list-container">
  <!-- Dynamic items loaded by JS -->
</div>

<!-- Projects Section -->
<div class="section-header" style="margin-top: 24px;">
  <h3 class="subsection-title">Projects</h3>
  <button type="button" id="add-project-btn" class="secondary-btn">+ Add Project</button>
</div>
<div id="projects-list" class="list-container">
  <!-- Dynamic items loaded by JS -->
</div>

<!-- Awards Section -->
<div class="section-header" style="margin-top: 24px;">
  <h3 class="subsection-title">Awards & Leadership</h3>
  <button type="button" id="add-award-btn" class="secondary-btn">+ Add Award</button>
</div>
<div id="awards-list" class="list-container">
  <!-- Dynamic items loaded by JS -->
</div>
